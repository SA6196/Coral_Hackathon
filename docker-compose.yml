version: "3.8"

services:
  coral-command-center:
    build:
      context: .
      dockerfile: Dockerfile
    image: coral-command-center:latest
    container_name: coral-command-center
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=coral-super-secret-key-123456789
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_DB=${NOTION_DB:-}
    restart: always
